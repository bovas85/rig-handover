name: Reusable Gemini Maintenance

on:
  workflow_call:
    inputs:
      mode:
        description: "Maintenance mode: legacy-reaper | keep-tests-tight | docs-freshness | friction-sweep"
        required: true
        type: string
      verify_cmd:
        description: "Repo verify command (e.g. yarn verify, pnpm verify, pytest)"
        required: false
        type: string
        default: "npm run verify"
      setup_runtime:
        description: "Runtime setup: node | python | none"
        required: false
        type: string
        default: "node"
      package_manager:
        description: "Node package manager: yarn | pnpm | npm"
        required: false
        type: string
        default: "yarn"
      node_version:
        description: "Node.js version when setup_runtime is node"
        required: false
        type: string
        default: "24"
      install_python:
        description: "Also install Python (for hybrid Node + Python repos)"
        required: false
        type: boolean
        default: false
      python_version:
        description: "Python version when setup_runtime is python or install_python is true"
        required: false
        type: string
        default: "3.12"
      only_if_recent_commits:
        description: "Skip scheduled runs if no commits landed in the last 24h"
        required: false
        type: boolean
        default: false
      gemini_model:
        description: "Gemini model name"
        required: false
        type: string
        default: "gemini-2.5-flash"
    secrets:
      GEMINI_CLI_LLM:
        required: false

jobs:
  run:
    name: Gemini ${{ inputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GEMINI_CLI_LLM and eligibility
        id: guard
        env:
          GEMINI_CLI_LLM: ${{ secrets.GEMINI_CLI_LLM }}
          ONLY_RECENT: ${{ inputs.only_if_recent_commits }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$GEMINI_CLI_LLM" ]; then
            echo "GEMINI_CLI_LLM not configured; skipping ${{ inputs.mode }}."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ONLY_RECENT" = "true" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            RECENT=$(git log -n 1 --since="24 hours ago" --format="%H")
            if [ -z "$RECENT" ]; then
              echo "No commits in the last 24h; skipping."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.guard.outputs.enabled == 'true' && inputs.setup_runtime == 'node' && inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.guard.outputs.enabled == 'true' && inputs.setup_runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install Node dependencies
        if: steps.guard.outputs.enabled == 'true' && inputs.setup_runtime == 'node'
        run: |
          case "${{ inputs.package_manager }}" in
            yarn) yarn install --frozen-lockfile ;;
            pnpm) pnpm install --frozen-lockfile ;;
            *) npm ci ;;
          esac

      - name: Setup Python
        if: steps.guard.outputs.enabled == 'true' && (inputs.setup_runtime == 'python' || inputs.install_python)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Python dependencies
        if: steps.guard.outputs.enabled == 'true' && inputs.setup_runtime == 'python'
        run: |
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi

      - name: Configure git identity for PR commits
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build maintenance prompt
        if: steps.guard.outputs.enabled == 'true'
        id: prompt
        env:
          MODE: ${{ inputs.mode }}
          VERIFY_CMD: ${{ inputs.verify_cmd }}
        run: |
          {
            echo "BODY<<EOF"
            case "$MODE" in
              legacy-reaper)
                cat <<PROMPT
          Read AGENTS.md, docs/feature-flags.md (if present), and docs/primitives.md (if present).
          1. Check open PRs via \`gh pr list --state open --json number,title,headRefName,body\` and open \`cleanup\` issues via \`gh issue list --label cleanup --state open --json number,title,labels,body\` ordered by priority P0 > P1 > P2 > P3. Skip any issue labeled \`needs-human\` or already addressed by an open PR.
          2. For any remaining \`cleanup\` issue whose "Ready when" condition now holds and whose "How to verify" check passes (or expired feature flags in docs/feature-flags.md), remove the dead code/flag or promote with \`cleanup-ready\`.
          3. Open at most ONE pull request on a new branch (never push directly to main, never merge a PR). Run \`$VERIFY_CMD\` before opening the PR and fill \`.github/PULL_REQUEST_TEMPLATE.md\` (if present). If nothing is ready, exit cleanly without creating a PR.
          PROMPT
                ;;
              keep-tests-tight)
                cat <<PROMPT
          Read AGENTS.md. Inspect recent commits (\`git log -n 10 --stat\`) and test files.
          Identify redundant, flaky, or implementation-detail tests that can be removed or tightened without reducing behavior coverage.
          If there is a clear improvement, create a new branch, update tests, run \`$VERIFY_CMD\`, and open at most ONE pull request using \`.github/PULL_REQUEST_TEMPLATE.md\` (explain why in Testing). Never push directly to main and never merge a PR. If no changes are needed, exit without opening a PR.
          PROMPT
                ;;
              docs-freshness)
                cat <<PROMPT
          Read AGENTS.md, README.md, docs/ (if present), and .agents/skills/ (if present).
          Check if recent commits (\`git log -n 10 --stat\`) made any doc, primitive \`adrs\` list, feature map, or skill stale.
          If stale docs/skills exist, create a new branch, update them cleanly, run \`$VERIFY_CMD\`, and open at most ONE pull request. Never push directly to main and never merge a PR. If everything is current, exit without opening a PR.
          PROMPT
                ;;
              friction-sweep)
                cat <<PROMPT
          Read AGENTS.md and friction-log guidance (if present).
          1. Check open PRs via \`gh pr list --state open --json number,title,headRefName,body\` and open \`friction\` issues via \`gh issue list --label friction --state open --json number,title,labels,body\`.
          2. Work highest priority first (\`P0 > P1 > P2 > P3\`). Skip any issue labeled \`needs-human\` or already addressed by an open PR.
          3. Close already-fixed or invalid friction issues with a short explanatory comment.
          4. Otherwise pick the single highest-priority actionable friction issue, fix it on a new branch, run \`$VERIFY_CMD\`, and open ONE pull request. Never push directly to main and never merge a PR.
          PROMPT
                ;;
              *)
                echo "Unknown mode: $MODE" >&2
                exit 1
                ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Gemini CLI (${{ inputs.mode }})
        if: steps.guard.outputs.enabled == 'true'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_CLI_LLM }}
          gemini_model: ${{ inputs.gemini_model }}
          settings: |
            {
              "model": {
                "maxSessionTurns": 30
              }
            }
          prompt: ${{ steps.prompt.outputs.BODY }}
