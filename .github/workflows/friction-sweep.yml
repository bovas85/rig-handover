name: Friction Sweep

on:
  schedule:
    # Daily at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  friction-sweep:
    uses: ./.github/workflows/reusable-gemini-maintenance.yml
    with:
      mode: friction-sweep
      verify_cmd: "pnpm verify"
      setup_runtime: "node"
      package_manager: "pnpm"
      node_version: "22"
      install_python: true
      python_version: "3.12"
    secrets:
      GEMINI_CLI_LLM: ${{ secrets.GEMINI_CLI_LLM }}
