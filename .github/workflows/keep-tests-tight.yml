name: Keep Tests Tight

on:
  schedule:
    # Weekly on Wednesdays at 08:00 UTC
    - cron: "0 8 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  keep-tests-tight:
    uses: ./.github/workflows/reusable-gemini-maintenance.yml
    with:
      mode: keep-tests-tight
      verify_cmd: "pnpm verify"
      setup_runtime: "node"
      package_manager: "pnpm"
      node_version: "22"
      install_python: true
      python_version: "3.12"
    secrets:
      GEMINI_CLI_LLM: ${{ secrets.GEMINI_CLI_LLM }}
